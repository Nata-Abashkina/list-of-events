<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/style.scss">
    <title>Список мероприятий</title>
  </head>
  <body>
    <div id="root">

      <header class="header">
        <img class="header__logo logo" src="/public/svg/logo.svg">
        <h1 class="header__title">Список мероприятий</h1>
        <button class="button" type="button">Добавить</button>
      </header>

      <main class="main">

        <section class="main__calendar"></section>

        <section class="main__events">
          <ul class="events__list">
            <li class="events__item">
              <date class="events__date">04.10.2026</date>
              <time class="events__time">14-00</time>
              <p class="events__text">Поздравить папу с ДР</p>
            </li>
          </ul>
          <button class="button" type="button">Добавить</button>
        </section>

      </main>

      <footer class="footer">
        <a class="footer__link" href="https://github.com/Nata-Abashkina/list-of-events" target="_blank">
          <img class="footer__link-logo" src="./public/svg/GitHub.svg">
          <p class="footer__link-text">GitHub</p>
        </a>
      </footer>
    </div>
    <!--<script type="module" src="/src/main.tsx"></script>-->
  </body>
</html>
